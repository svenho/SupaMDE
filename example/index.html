<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SupaMDE — Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" crossorigin="anonymous">
    <!-- NO defer: window.katex must be set before the SupaMDE module renders for the
         first time. (With defer, the first render might run before window.katex is set
         and briefly show raw text; resolveKatex() catches up on the next render.) -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" crossorigin="anonymous"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    </style>
  </head>
  <body>
    <h1>SupaMDE</h1>
    <p>Markdown editor demo with a configurable toolbar, status bar, preview,
      side-by-side view and fullscreen. LaTeX formulas are rendered with KaTeX,
      which is loaded from the CDN and available globally.</p>
    <form id="demo-form">
      <textarea id="editor" name="editor">
# SupaMDE with LaTeX

Inline formula: $E = mc^2$ in the middle of the text.

Block formula:

$$
\int_0^\infty e^{-x^2}\,dx = \frac{\sqrt{\pi}}{2}
$$

Aligned equations:

$$
\begin{align}
a &= b + c \\
x &= y - z
\end{align}
$$

A price like $5 and $10 stays text.
</textarea>
      <button type="submit">Submit (forceSync demo)</button>
    </form>
    <h2>Submitted value</h2>
    <pre id="submitted" style="white-space: pre-wrap;">Nothing submitted yet.</pre>
    <script type="module">
      import SupaMDE from '../src/index.ts';
      const editor = new SupaMDE({
        element: document.getElementById('editor'),
        placeholder: 'Write some Markdown …',
        // Default toolbar + a custom button that writes the word count into the status bar.
        // View: 'preview-fullscreen' toggles preview and fullscreen together (F8) and is
        // part of the default toolbar as well. The individual buttons next to it show that
        // they can still be configured explicitly.
        toolbar: [
          'bold', 'italic', 'strikethrough', 'code', '|',
          'quote', 'unordered-list', 'ordered-list', 'check-list', '|',
          'link', 'image', 'table', '|', 'undo', 'redo', '|',
          'editor-mode', 'preview-fullscreen', 'side-by-side', 'fullscreen',
        ],
        status: ['lines', 'words', 'cursor'],
      });
      // Registered after the SupaMDE constructor, so SupaMDE's own submit listener
      // (forceSync) has already copied the editor content into the textarea when this
      // runs. preventDefault keeps the page from reloading and losing the content.
      document.getElementById('demo-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const value = new FormData(event.currentTarget).get('editor');
        document.getElementById('submitted').textContent = value;
      });
      // eslint-disable-next-line no-console
      console.log('SupaMDE version:', SupaMDE.version, editor.getValue());
    </script>
  </body>
</html>

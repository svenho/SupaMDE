<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SupaMDE — M4 LaTeX-Vorschau</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css" crossorigin="anonymous">
    <!-- KEIN defer: window.katex muss stehen, bevor das SupaMDE-Modul erstmals rendert.
         (Mit defer würde der erste Render evtl. vor gesetztem window.katex laufen und
         kurz Rohtext zeigen; resolveKatex() greift beim nächsten Render nach.) -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js" crossorigin="anonymous"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    </style>
  </head>
  <body>
    <h1>SupaMDE</h1>
    <p>M4: LaTeX-Vorschau mit Side-by-Side-Anzeige, Fullscreen und Live-Rendering.
      KaTeX ist vom CDN geladen und global verfügbar.</p>
    <form>
      <textarea id="editor">
# SupaMDE mit LaTeX

Inline-Formel: $E = mc^2$ mitten im Text.

Block-Formel:

$$
\int_0^\infty e^{-x^2}\,dx = \frac{\sqrt{\pi}}{2}
$$

Ausgerichtete Gleichungen:

$$
\begin{align}
a &= b + c \\
x &= y - z
\end{align}
$$

Ein Preis wie $5 und $10 bleibt Text.
</textarea>
      <button type="submit">Absenden (forceSync-Demo)</button>
    </form>
    <script type="module">
      import SupaMDE from '../src/index.ts';
      const editor = new SupaMDE({
        element: document.getElementById('editor'),
        placeholder: 'Schreibe etwas Markdown …',
        // Default-Toolbar + ein eigener Button, der die Wortzahl in die Statusbar schreibt.
        // Ansicht: 'preview-fullscreen' schaltet Vorschau und Vollbild gemeinsam (F8) und
        // steht so auch in der Default-Toolbar. Die Einzel-Buttons daneben zeigen, dass sie
        // weiterhin explizit konfigurierbar sind.
        toolbar: [
          'bold', 'italic', 'strikethrough', 'code', '|',
          'quote', 'unordered-list', 'ordered-list', 'check-list', '|',
          'link', 'image', 'table', '|', 'undo', 'redo', '|',
          'editor-mode', 'preview-fullscreen', 'side-by-side', 'fullscreen',
        ],
        status: ['lines', 'words', 'cursor'],
      });
      // eslint-disable-next-line no-console
      console.log('SupaMDE-Version:', SupaMDE.version, editor.getValue());
    </script>
  </body>
</html>
